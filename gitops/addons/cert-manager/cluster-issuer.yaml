# Design-only. Do not apply in Phase 09A.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
spec:
  ca:
    secretName: platform-internal-ca
---
# Public issuer is PENDING OPERATOR (ACME account + approved public zone).
# Do not invent a public domain. Keep internal-ca as the default for private hosts.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: public-acme
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: public-acme-account
    solvers:
      - dns01:
          route53:
            region: us-east-1
