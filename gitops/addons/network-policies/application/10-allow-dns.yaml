# DNS to CoreDNS only (kube-system / k8s-app=kube-dns). Do not allow cluster-wide DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: 10-allow-dns
  labels:
    platform.policy: allow-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
