apiVersion: v1
kind: Namespace
metadata:
  name: recovery-validation
  labels:
    platform.example/phase: "10E"
    platform.purpose: backup-restore-proof
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: v1.35
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: marker
  namespace: recovery-validation
  labels:
    app.kubernetes.io/name: recovery-validation
    platform.example/phase: "10E"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp3
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: recovery-meta
  namespace: recovery-validation
  labels:
    app.kubernetes.io/name: recovery-validation
data:
  purpose: "10E restore drill — no secrets"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marker
  namespace: recovery-validation
  labels:
    app.kubernetes.io/name: recovery-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: recovery-validation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recovery-validation
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if [ ! -f /data/marker ]; then
                echo "recovery-validation $(date -u +%Y-%m-%dT%H:%M:%SZ) $(cat /proc/sys/kernel/random/uuid 2>/dev/null || echo nouuid)" > /data/marker
              fi
              sha256sum /data/marker | awk '{print $1}' > /data/marker.sha256
              exec /agnhost pause
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: marker
