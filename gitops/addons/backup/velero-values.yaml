# Velero Helm chart 12.1.0 / app v1.18.1. AWS plugin v1.13.1.
# IRSA: set serviceAccount.server.annotations at install. credentials.useSecret must stay false.
# CSI snapshots via VolumeSnapshotClass ebs-csi-gp3. No node-agent (no hostPath). No default-deny on ns velero.
# Namespace unlabeled (PSS exception like kube-system).

image:
  repository: docker.io/velero/velero
  tag: v1.18.1
  pullPolicy: IfNotPresent

kubectl:
  image:
    repository: registry.k8s.io/kubectl
    tag: v1.35.0

upgradeCRDs: true

initContainers:
  - name: velero-plugin-for-aws
    image: docker.io/velero/velero-plugin-for-aws:v1.13.1
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

credentials:
  useSecret: false

serviceAccount:
  server:
    create: true
    name: velero
    annotations: {}

configuration:
  features: EnableCSI
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: REPLACE-AT-INSTALL
      default: true
      config:
        region: us-east-1
  volumeSnapshotLocation:
    - name: default
      provider: aws
      config:
        region: us-east-1

backupsEnabled: true
snapshotsEnabled: true
deployNodeAgent: false

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
