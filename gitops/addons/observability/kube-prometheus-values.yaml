# kube-prometheus-stack 90.0.0. Helm bootstrap remains the owner of the stack.
# 10C: Git-manage extra PrometheusRules / ServiceMonitors / dashboards; do not Argo-migrate the stack.
# Retention decision A: keep 7d local TSDB; operational SLO windows <= 7d. No Thanos/Mimir/AMP.
grafana:
  enabled: true
  persistence:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
    # externalLabels come from values-nonprod.yaml / values-prod.yaml
alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: local-null
      group_by:
        - namespace
        - alertname
        - severity
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: local-null
          matchers:
            - alertname = Watchdog
        - receiver: local-page
          matchers:
            - severity = page
        - receiver: local-ticket
          matchers:
            - severity = ticket
    receivers:
      - name: local-null
      - name: local-page
      - name: local-ticket
    inhibit_rules:
      - source_matchers:
          - severity = page
        target_matchers:
          - severity = ticket
        equal:
          - namespace
          - alertname
      - source_matchers:
          - severity = page
        target_matchers:
          - severity = info
        equal:
          - namespace
          - alertname
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
# Forward application logs to CloudWatch log groups created by Terraform:
#   /eks/<cluster>/application
#   /eks/<cluster>/dataplane
#   /eks/<cluster>/host
# Tracing (OpenTelemetry) is PLANNED, not installed here.
