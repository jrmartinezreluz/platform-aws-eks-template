apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-workload-health
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    platform.example/phase: "10C"
  annotations:
    grafana_folder: Platform
data:
  workload-health.json: |-
    {
      "uid": "platform-workloads",
      "title": "Platform / Workload Health",
      "tags": [
        "arkhadia",
        "phase10c"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "editable": false,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            },
            "refresh": 1,
            "includeAll": false,
            "options": [],
            "regex": ""
          },
          {
            "name": "cluster",
            "type": "query",
            "datasource": "$datasource",
            "definition": "label_values(up, cluster)",
            "query": {
              "query": "label_values(up, cluster)",
              "refId": "cluster"
            },
            "refresh": 1,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": [],
            "regex": ""
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Environment",
          "gridPos": {
            "h": 3,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "**This Grafana scrapes the local cluster only.** Open Grafana on **eks-nonprod** or **eks-prod** via private kube context / VPN. Prometheus `cluster` / `environment` externalLabels are set in 10C overlays. Dashboard `platform-workloads`."
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Container CPU",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{container!=\"\",cluster=~\"$cluster\"}[5m]))",
              "refId": "A",
              "legendFormat": "{{namespace}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Container RSS",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "sum by (namespace) (container_memory_working_set_bytes{container!=\"\",cluster=~\"$cluster\"})",
              "refId": "A",
              "legendFormat": "{{namespace}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Restarts",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 11
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "sum by (namespace) (increase(kube_pod_container_status_restarts_total{cluster=~\"$cluster\"}[1h]))",
              "refId": "A",
              "legendFormat": "{{namespace}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        }
      ],
      "annotations": {
        "list": []
      },
      "refresh": "1m"
    }
