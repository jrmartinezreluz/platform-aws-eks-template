apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-kyverno
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    platform.example/phase: "10D"
spec:
  groups:
    - name: platform.kyverno
      rules:
        - alert: PlatformKyvernoAdmissionUnavailable
          expr: |
            kube_deployment_status_replicas_available{namespace="kyverno",deployment=~".*admission-controller"} < 1
          for: 5m
          labels:
            severity: page
            team: platform
          annotations:
            summary: Kyverno admission controller has no available replicas
            description: Cluster writes may fail or skip policy if forceFailurePolicyIgnore is set.
            runbook: docs/phase10/runbooks/admission-webhook-failure.md
        - alert: PlatformKyvernoAdmissionErrors
          expr: increase(kyverno_admission_review_duration_seconds_count{error="true"}[15m]) > 10
          for: 15m
          labels:
            severity: ticket
            team: platform
          annotations:
            summary: Kyverno admission reviews reporting errors
            runbook: docs/phase10/runbooks/admission-webhook-failure.md
        - alert: PlatformKyvernoHighAdmissionLatency
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(kyverno_admission_review_duration_seconds_bucket[5m]))) > 5
          for: 15m
          labels:
            severity: ticket
            team: platform
          annotations:
            summary: Kyverno p99 admission latency above 5s
            runbook: docs/phase10/runbooks/admission-webhook-failure.md
