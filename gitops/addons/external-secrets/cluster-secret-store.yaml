# ClusterSecretStore aws-secrets-manager. Identity is IRSA on SA external-secrets
# (Pod Identity blocked by org SCP p-m8ajqk1n). Do not put secret values in Git.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
# Secret name contract: apps/<solution>/<environment>/<secret>
# Example keys (values never in Git):
#   apps/hospitality-booking/staging/database
#   apps/enterprise-erp/production/admin
#   apps/workflow-automation/uat/environment
